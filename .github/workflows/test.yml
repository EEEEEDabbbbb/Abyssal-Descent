# Runs the browser test suite (tests/*.test.js) on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install-deps chromium
      - name: Run tests
        run: npm test
